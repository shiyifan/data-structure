<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTree</title>
  </head>
  <body>
    <h1>For Data Structure</h1>

    <ul>
      <li>B-Tree</li>
    </ul>

    <script>
      console.log('%cvisualize tree: %s', 'color: #7C16F0; font-size: 1.25em', 'https://dbis-btree.uibk.ac.at/');
    </script>

    <script>
      /* B-Tree结点 */
      function BNode(parent) {
        /* 结点中所有的关键字，**按升序排列** */
        this.keys = [];

        /* 子树的根节点，其中，children.length = keys.length + 1，children[i]与children[i + 1]为keys[i]的左右子树
           children[i]的所有key均小于keys[i]，children[i + 1]的所有key均大于keys[i] */
        this.children = [];

        this.parent = parent; // 父结点
      }

      /* B-Tree */
      function BTree(order) {
        this.root = null; // 根结点
        this.order = order; // B树的阶, "阶数 - 1"为结点最多可保存的key个数
      }

      Object.defineProperties(BTree.prototype, {
        /* 结点可保存的最少关键字个数 */
        minKeyNum: {
          get() {
            return Math.ceil(this.order / 2) - 1;
          },
        },
        /* 结点可保存的最多关键字个数 */
        maxKeyNum: {
          get() {
            return this.order - 1;
          },
        },
      });

      /* 将BTree导出为JSON格式，该格式可作为参数输入到'https://dbis-btree.uibk.ac.at/'中，显示该树的可视化图像，
         注意，可视化时，需要确保为合法的BTree结构 */
      BTree.prototype.export = function () {
        const output = { maxKeys: this.maxKeyNum, keyType: 'number' };
        const nodeData = {}; // 适合可视化的树结点，类似于BNode，用树状结构保存整颗树的结点

        if (!this.root) return '(empty BTree)';

        /* 树结点的json结构:
          {
            name: {
              id: 0     // 唯一编号,
              keys: []  // 所有的关键字
            },
            children: [ ... ]  // 所有子结点
          }
        */

        let i = 0; // 结点编号
        const queue = [];
        queue.push({ node: this.root, json: nodeData });

        /* 以按层遍历的方式构建可视化的树状结构 */
        while (queue.length > 0) {
          const { node, json } = queue.shift();
          json.name = { id: i++, keys: node.keys.slice() };
          json.children = [];

          for (let idx = 0; idx < node.children.length; idx++) {
            if (!node.children[idx]) continue;

            json.children[idx] = {};
            queue.push({ node: node.children[idx], json: json.children[idx] });
          }
        }

        output.nodeData = nodeData;
        return JSON.stringify(output);
      };

      /* 在BTree中查询key，如果key不存在则插入,插入后按需要调整BTree */
      BTree.prototype.search = function (...keys) {
        for (const key of keys) {
          if (!this.root) {
            // 该BTree尚未初始化

            const n = new BNode();
            n.keys.push(key);
            n.children.length += 2; // keys长度更新时，也要同时更新children的长度，由于是插入第一个key，所以长度增加2
            this.root = n;
            continue;
          }

          let node = this.root;
          let lastNode, lastKeyI; // 查找失败时，保存最后一个遍历的结点以及key应该位于的索引

          /* 如果当前结点有匹配的key，则通过折半查找确定key的索引，否则确定下一步被查找的子树的位置 */
          while (node) {
            const { found, i } = this.bSearch(node.keys, key); // 折半查找

            if (found) break;

            // found === false，当前结点查找失败

            lastNode = node;
            lastKeyI = i + 1;
            node = node.children[i + 1];
          } // while (node)

          if (node) continue; // 查找成功，继续查找下一个

          // 查找失败，树中没有该关键字，插入这个关键字
          insertKey.call(this, lastNode, lastKeyI, key);
        } // for (keys)

        /* 在结点node中的position位置插入key */
        function insertKey(node, position, key) {
          let insertedK = key;
          let insNode = node;
          let insIndex = position;
          let newNode = null; // 分裂后产生的新结点

          while (true) {
            const { keys: insKeys, children: insChildren } = insNode;

            /* 在insNode的insIndex位置插入该关键字 */
            insKeys.splice(insIndex, 0, insertedK);

            if (!newNode) {
              // 叶子结点仅需要增加长度，无需调整子树指针
              insChildren.length++;
            } else {
              // 下层结点已分裂，且分裂点的key已插入当前结点，还需插入一个指向新结点的子树指针
              insChildren.splice(insIndex + 1, 0, newNode);
            }

            if (insKeys.length <= this.maxKeyNum) {
              /* 插入元素后，结点key个数未超过最大个数(阶数 - 1)，查找下一个结点 */
              break;
            }

            /* 超过最大个数需要分裂这个结点
               分裂为两个结点: 第一个结点拥有BTree所要求的最少key个数，另一个拥有剩余的key。并将位于分裂点的key插入父结点中
               可将被分裂的结点作为第一个结点，新建一个结点作为第二个结点 */

            const splitI = this.minKeyNum; // 分裂点索引，BTree结点至少拥有"(阶数 / 2) - 1"个key值，但根节点至少拥有一个key值
            insertedK = insKeys[splitI]; // 分裂点key，将被插入父结点

            newNode = new BNode(insNode.parent);
            /* 将分裂点右侧[splitI + 1 ... insKeys.length - 1]的key与children复制到新结点中 */
            const spStart = splitI + 1; // 原结点中分裂起始索引
            newNode.keys = insKeys.slice(spStart);
            newNode.children = insChildren.slice(spStart);
            newNode.children.forEach(n => n && (n.parent = newNode)); // 同时需要更新分裂点右侧子树的父结点为新建结点

            /* 删除分裂点右侧key，包括位于分裂点的key，分裂点左侧[0 ... splitI - 1]的key保留在原结点中 */
            insKeys.length = splitI;
            /* 同时删除分裂点右侧的所有子树，但不包括位于分裂点索引的子树（因为children[i] < key[i] < children[i + 1]） */
            insChildren.length = splitI + 1;

            if (!insNode.parent) {
              // 被分裂的结点是根节点，需创建新的根节点

              const newRoot = new BNode();
              newRoot.keys.push(insertedK);
              newRoot.children.push(insNode, newNode);
              insNode.parent = newNode.parent = newRoot;
              this.root = newRoot;

              break;
            }
            // 被分裂的结点不是根节点，继续向上判断
            insNode = insNode.parent; // 下一次循环将key插入父结点中

            const { i: insertedI } = this.bSearch(insNode.keys, insertedK); // 计算分割点key在父结点中插入的位置
            insIndex = insertedI + 1;
          } // while
        }
      }; // end BTree.prototype.search

      /* 在结点中折半查找key
        返回值:
          {
            found:
              是否找到key

            i: 索引
              如果找到key，i表示对应key的索引，
              否则, (i不可能等于keys.length - 1)
                0 <= i <= keys.length - 2:   key位于keys[i]与keys[i + 1]之间
                i === -1:                    key位于keys[0]之前
                i === keys.length - 1:       key位于keys[keys.length - 1]之后
              上面未找到key的三种情况下，需要继续在children[i + 1]子树中查找
          }
        */
      BTree.prototype.bSearch = function (keys, key) {
        let low = 0;
        let high = keys.length - 1;

        while (low <= high) {
          const middle = Math.floor((low + high) / 2);

          if (keys[middle] === key) return { found: true, i: middle };

          if (keys[middle] < key) {
            low = middle + 1;
            continue;
          }

          // keys[middle] > key
          high = middle - 1;
        }

        if (high < 0) {
          // key值位于第一个关键字之前
          return { found: false, i: -1 };
        }
        if (low > keys.length - 1) {
          // key值位于最后一个关键字之后
          return { found: false, i: keys.length - 1 };
        }

        return { found: false, i: high };
      }; // end BTree.prototype.bSearch

      /* 在BTree中删除key，如果key存在则删除，删除后按需要调整BTree。如果不存在则不修改BTree并继续查找下一个key */
      BTree.prototype.remove = function (...keys) {
        for (const key of keys) {
          if (!this.root) return; // 树尚未初始化，无法删除结点，直接返回

          let node = this.root;
          let removedI;
          while (node) {
            const { found, i } = this.bSearch(node.keys, key);
            removedI = i;

            if (found) break;

            node = node.children[i + 1];
          }
          // 查找结束

          if (!node) continue; // 查找失败，树中没有该key，继续查找下一个

          // 查找成功，node.keys[removedI]为待删除的key
          removeKey.call(this, node, removedI);
        } // for

        // 删除node.keys[index]中的关键字，并在删除后按需要调整BTree
        function removeKey(node, index) {
          /* 根据BTree的插入新key的方式，结点的子树数组children要么全部为空，要么全部非空。如果为空则表示该结点为叶子结点 */
          const isChild = !node.children[index];
          let removedNode;

          if (isChild) {
            // 待删key位于叶子结点上

            removedNode = node;
            node.keys.splice(index, 1);
            node.children.length--; // 子树数组中的值均为空，无需移动元素
          } else {
            /* 待删key位于非叶子结点上，此时找到比待删key小的最大key，然后替换至key的位置上。
            最大的key位于叶子结点上，然后在叶子结点上删除 */

            removedNode = node.children[index];
            while (removedNode.children.at(-1)) {
              removedNode = removedNode.children.at(-1); // 寻找子树中最大的key
            }

            node.keys[index] = removedNode.keys.pop(); // 替换
            removedNode.children.length--;
          }

          // 依据删除后key的个数是否小于最小值，按需要调整树

          while (removedNode.keys.length < this.minKeyNum) {
            if (removedNode === this.root) {
              if (removedNode.keys.length === 0) {
                this.root = removedNode.children[0];
                this.root && (this.root.parent = null);
              }
              break;
            }

            const removeParent = removedNode.parent;
            const parentKeys = removeParent.keys;
            const parentChildren = removeParent.children;
            const removedIndex = parentChildren.indexOf(removedNode);
            const leftSibling = parentChildren[removedIndex - 1];
            const rightSibling = parentChildren[removedIndex + 1];

            /* 左兄弟结点的key个数未达到最小值，从左兄弟结点中借取一个元素 */
            if (leftSibling && leftSibling.keys.length > this.minKeyNum) {
              // 从左兄弟结点中选取最大的关键字移动至父结点，父结点的邻近关键字移动至removedNode中

              removedNode.keys.unshift(parentKeys[removedIndex - 1]); // 父结点中的key插在removedNode第一个位置
              parentKeys[removedIndex - 1] = leftSibling.keys.pop();

              const leftLast = leftSibling.children.pop();
              leftLast && (leftLast.parent = removedNode); // 更新被移动的子树的父结点
              removedNode.children.unshift(leftLast);

              return;
            }

            /* 右兄弟结点的key个数未达到最小值，从右兄弟结点中借取一个元素 */
            if (rightSibling && rightSibling.keys.length > this.minKeyNum) {
              // 从右兄弟结点中选取最小的关键字移动至父结点，父结点的邻近关键字移动至removedNode中

              removedNode.keys.push(parentKeys[removedIndex]);
              parentKeys[removedIndex] = rightSibling.keys.shift();

              const rightFirst = rightSibling.children.shift();
              rightFirst && (rightFirst.parent = removedNode);
              removedNode.children.push(rightFirst);

              return;
            }

            // 左右兄弟结点均仅剩最少个数的key，需要合并结点

            if (leftSibling) {
              // removedNode与左兄弟结点合并，将左兄弟合并至removedNode中

              removedNode.keys.unshift(...leftSibling.keys, parentKeys[removedIndex - 1]);

              leftSibling.children.forEach(n => n && (n.parent = removedNode)); // 更新左兄弟结点中的子树的parent指针
              removedNode.children.unshift(...leftSibling.children);

              parentChildren.splice(removedIndex - 1, 1);
              parentKeys.splice(removedIndex - 1, 1);

              /* 合并时，父结点失去了一个key，因此需要继续判断父结点key个数是否已小于最小值 */
              removedNode = removeParent;
              continue;
            }

            if (rightSibling) {
              // removedNode与右兄弟结点合并，将右兄弟合并至removedNode中

              removedNode.keys.push(parentKeys[removedIndex], ...rightSibling.keys);

              rightSibling.children.forEach(n => n && (n.parent = removedNode));
              removedNode.children.push(...rightSibling.children);

              parentChildren.splice(removedIndex + 1, 1);
              parentKeys.splice(removedIndex, 1);

              removedNode = removeParent;
              continue;
            }
          } // while ()
        } // function removeKey
      };

      const bt = new BTree(4);
      bt.search(35, 30, 25, 20, 15, 10, 5);
      console.log('bt search: \n%s', bt.export());

      bt.remove(5, 10, 15, 20, 25, 30, 35);
      console.log('bt remove: \n%s', bt.export());

      bt.search(5, 10, 15, 20, 25, 30, 35);
      console.log('bt 2 search: \n%s', bt.export());
    </script>
  </body>
</html>
