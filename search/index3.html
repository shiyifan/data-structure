<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTree</title>
  </head>
  <body>
    <h1>For Data Structure</h1>

    <ul>
      <li>B-Tree</li>
    </ul>

    <script>
      console.log('%cvisualize tree: %s', 'color: #7C16F0; font-size: 1.25em', 'https://dbis-btree.uibk.ac.at/');
    </script>

    <script>
      /* B-Tree结点 */
      function BNode(parent) {
        /* 结点中所有的关键字 */
        this.keys = [];

        /* 子树的根节点，其中，children.length = keys.length + 1，children[i]与children[i + 1]为keys[i]的左右子树
        children[i]的所有key均小于keys[i]，children[i + 1]的所有key均大于keys[i] */
        this.children = [];

        this.parent = parent; // 父结点
      }

      /* B-Tree */
      function BTree(root, order) {
        this.root = root; // 根结点
        this.order = order; // B树的阶
      }

      /* 将BTree导出为JSON格式，该格式可作为参数输入到'https://dbis-btree.uibk.ac.at/'中，显示该树的可视化图像 */
      BTree.prototype.export = function () {
        const output = { maxKeys: this.order - 1, keyType: 'number' };
        const nodeData = {}; // 适合可视化的树结点，类似于BNode，用树状结构保存整颗树的结点

        /* 树结点的json结构: 
          { 
            name: {  
              id: 0     // 唯一编号, 
              keys: []  // 所有的关键字
            }, 
            children: [ ... ]  // 所有子结点
          }
        */

        let i = 0; // 结点编号
        const queue = [];
        queue.push({ node: this.root, json: nodeData });

        /* 以按层遍历的方式构建可视化的树状结构 */
        while (queue.length > 0) {
          const { node, json } = queue.shift();
          json.name = { id: i++, keys: node.keys.slice() };
          json.children = [];

          for (let idx = 0; idx < node.children.length; idx++) {
            json.children[idx] = {};
            queue.push({ node: node.children[idx], json: json.children[idx] });
          }
        }

        output.nodeData = nodeData;
        return JSON.stringify(output);
      };

      const n0 = new BNode();
      n0.keys.push(2);

      const t = new BTree(n0, 3);

      const n1 = new BNode();
      n1.keys.push(0, 1);
      n0.children.push(n1);

      const n2 = new BNode();
      n2.keys.push(15);
      n0.children.push(n2);

      // const n3 = new BNode();
      // n3.keys.push(0.1, 0.2);
      // n1.children.push(n3);

      const s = t.export();

      console.log(s);
    </script>
  </body>
</html>
