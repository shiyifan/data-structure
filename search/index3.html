<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTree</title>

  <body>
    <h1>For Data Structure</h1>

    <ul>
      <li>B Tree</li>
      <li>B<sup>+</sup> Tree</li>
    </ul>

    <script>
      console.log('%cBTree可视化工具: %s', 'color: #7C16F0; font-size: 1.25em', 'https://dbis-btree.uibk.ac.at/');
      console.log('%c目前没找到可视化B+Tree的工具', 'color: #F5275C; font-size: 1.25em');
    </script>

    <script>
      /* B-Tree结点 */
      function BNode(parent) {
        /* 结点中所有的关键字，**按升序排列** */
        this.keys = [];

        /* 子树的根节点，其中，children.length = keys.length + 1，children[i]与children[i + 1]为keys[i]的左右子树
           children[i]的所有key均小于keys[i]，children[i + 1]的所有key均大于keys[i] */
        this.children = [];

        this.parent = parent; // 父结点
      }

      /* B-Tree */
      function BTree(order) {
        this.root = null; // 根结点
        this.order = order; // B树的阶, "阶数 - 1"为结点最多可保存的key个数
      }

      Object.defineProperties(BTree.prototype, {
        /* 结点可保存的最少关键字个数 */
        minKeyNum: {
          get() {
            return Math.ceil(this.order / 2) - 1;
          },
        },
        /* 结点可保存的最多关键字个数 */
        maxKeyNum: {
          get() {
            return this.order - 1;
          },
        },
      });

      /* 将BTree导出为JSON格式，该格式可作为参数输入到'https://dbis-btree.uibk.ac.at/'中，显示该树的可视化图像，
         注意，可视化时，需要确保为合法的BTree结构 */
      BTree.prototype.export = function () {
        const output = { maxKeys: this.maxKeyNum, keyType: 'number' };
        const nodeData = {}; // 适合可视化的树结点，类似于BNode，用树状结构保存整颗树的结点

        if (!this.root) return '(empty BTree)';

        /* 树结点的json结构:
          {
            name: {
              id: 0     // 唯一编号,
              keys: []  // 所有的关键字
            },
            children: [ ... ]  // 所有子结点
          }
        */

        let i = 0; // 结点编号
        const queue = [];
        queue.push({ node: this.root, json: nodeData });

        /* 以按层遍历的方式构建可视化的树状结构 */
        while (queue.length > 0) {
          const { node, json } = queue.shift();
          json.name = { id: i++, keys: node.keys.slice() };
          json.children = [];

          for (let idx = 0; idx < node.children.length; idx++) {
            if (!node.children[idx]) continue;

            json.children[idx] = {};
            queue.push({ node: node.children[idx], json: json.children[idx] });
          }
        }

        output.nodeData = nodeData;
        return JSON.stringify(output);
      };

      /* 在BTree中查询key，如果key不存在则插入,插入后按需要调整BTree */
      BTree.prototype.search = function (...keys) {
        for (const key of keys) {
          if (!this.root) {
            // 该BTree尚未初始化

            const n = new BNode();
            n.keys.push(key);
            n.children.length += 2; // keys长度更新时，也要同时更新children的长度，由于是插入第一个key，所以长度增加2
            this.root = n;
            continue;
          }

          let node = this.root;
          let lastNode, lastKeyI; // 查找失败时，保存最后一个遍历的结点以及key应该位于的索引

          /* 如果当前结点有匹配的key，则通过折半查找确定key的索引，否则确定下一步被查找的子树的位置 */
          while (node) {
            const { found, i } = this.bSearch(node.keys, key); // 折半查找

            if (found) break;

            // found === false，当前结点查找失败

            lastNode = node;
            lastKeyI = i + 1;
            node = node.children[i + 1];
          } // while (node)

          if (node) continue; // 查找成功，继续查找下一个

          // 查找失败，树中没有该关键字，插入这个关键字
          insertKey.call(this, lastNode, lastKeyI, key);
        } // for (keys)

        /* 在结点node中的position位置插入key */
        function insertKey(node, position, key) {
          let insertedK = key;
          let insNode = node;
          let insIndex = position;
          let newNode = null; // 分裂后产生的新结点

          while (true) {
            const { keys: insKeys, children: insChildren } = insNode;

            /* 在insNode的insIndex位置插入该关键字 */
            insKeys.splice(insIndex, 0, insertedK);

            if (!newNode) {
              // 叶子结点仅需要增加长度，无需调整子树指针
              insChildren.length++;
            } else {
              // 下层结点已分裂，且分裂点的key已插入当前结点，还需插入一个指向新结点的子树指针
              insChildren.splice(insIndex + 1, 0, newNode);
            }

            if (insKeys.length <= this.maxKeyNum) {
              /* 插入元素后，结点key个数未超过最大个数(阶数 - 1)，查找下一个结点 */
              break;
            }

            /* 超过最大个数需要分裂这个结点
               分裂为两个结点: 第一个结点拥有BTree所要求的最少key个数，另一个拥有剩余的key。并将位于分裂点的key插入父结点中
               可将被分裂的结点作为第一个结点，新建一个结点作为第二个结点 */

            const splitI = this.minKeyNum; // 分裂点索引，BTree结点至少拥有"(阶数 / 2) - 1"个key值，但根节点至少拥有一个key值
            insertedK = insKeys[splitI]; // 分裂点key，将被插入父结点

            newNode = new BNode(insNode.parent);
            /* 将分裂点右侧[splitI + 1 ... insKeys.length - 1]的key与children复制到新结点中 */
            const spStart = splitI + 1; // 原结点中分裂起始索引
            newNode.keys = insKeys.slice(spStart);
            newNode.children = insChildren.slice(spStart);
            newNode.children.forEach(n => n && (n.parent = newNode)); // 同时需要更新分裂点右侧子树的父结点为新建结点

            /* 删除分裂点右侧key，包括位于分裂点的key，分裂点左侧[0 ... splitI - 1]的key保留在原结点中 */
            insKeys.length = splitI;
            /* 同时删除分裂点右侧的所有子树，但不包括位于分裂点索引的子树（因为children[i] < key[i] < children[i + 1]） */
            insChildren.length = splitI + 1;

            if (!insNode.parent) {
              // 被分裂的结点是根节点，需创建新的根节点

              const newRoot = new BNode();
              newRoot.keys.push(insertedK);
              newRoot.children.push(insNode, newNode);
              insNode.parent = newNode.parent = newRoot;
              this.root = newRoot;

              break;
            }
            // 被分裂的结点不是根节点，继续向上判断
            insNode = insNode.parent; // 下一次循环将key插入父结点中

            const { i: insertedI } = this.bSearch(insNode.keys, insertedK); // 计算分割点key在父结点中插入的位置
            insIndex = insertedI + 1;
          } // while
        }
      }; // end BTree.prototype.search

      /* 在结点中折半查找key
        返回值:
          {
            found:
              是否找到key

            i: 索引
              如果找到key，i表示对应key的索引，
              否则, (i不可能等于keys.length - 1)
                0 <= i <= keys.length - 2:   key位于keys[i]与keys[i + 1]之间
                i === -1:                    key位于keys[0]之前
                i === keys.length - 1:       key位于keys[keys.length - 1]之后
              上面未找到key的三种情况下，需要继续在children[i + 1]子树中查找
          }
        */
      BTree.prototype.bSearch = function (keys, key) {
        let low = 0;
        let high = keys.length - 1;

        while (low <= high) {
          const middle = Math.floor((low + high) / 2);

          if (keys[middle] === key) return { found: true, i: middle };

          if (keys[middle] < key) {
            low = middle + 1;
            continue;
          }

          // keys[middle] > key
          high = middle - 1;
        }

        if (high < 0) {
          // key值位于第一个关键字之前
          return { found: false, i: -1 };
        }
        if (low > keys.length - 1) {
          // key值位于最后一个关键字之后
          return { found: false, i: keys.length - 1 };
        }

        return { found: false, i: high };
      }; // end BTree.prototype.bSearch

      /* 在BTree中删除key，如果key存在则删除，删除后按需要调整BTree。如果不存在则不修改BTree并继续查找下一个key */
      BTree.prototype.remove = function (...keys) {
        for (const key of keys) {
          if (!this.root) return; // 树尚未初始化，无法删除结点，直接返回

          let node = this.root;
          let removedI; // 待删key所在的索引，或者下一次查找的子树的前一个索引
          while (node) {
            const { found, i } = this.bSearch(node.keys, key);
            removedI = i;

            if (found) break;

            node = node.children[i + 1];
          }
          // 查找结束

          if (!node) continue; // 查找失败，树中没有该key，继续查找下一个

          // 查找成功，node.keys[removedI]为待删除的key
          removeKey.call(this, node, removedI);
        } // for

        // 删除node.keys[index]中的关键字，并在删除后按需要调整BTree
        function removeKey(node, index) {
          /* 根据BTree的插入新key的方式，结点的子树数组children要么全部为空，要么全部非空。如果为空则表示该结点为叶子结点 */
          const isChild = !node.children[index];
          let removedNode; // 被删除key的结点

          if (isChild) {
            // 待删key位于叶子结点上

            removedNode = node;
            node.keys.splice(index, 1);
            node.children.length--; // 子树数组中的值均为空，无需移动元素
          } else {
            /* 待删key位于非叶子结点上，此时找到比待删key小的最大key，然后替换至key的位置上。
               最大的key位于叶子结点上，然后在叶子结点上删除 */

            removedNode = node.children[index];
            while (removedNode.children.at(-1)) {
              removedNode = removedNode.children.at(-1); // 寻找子树中最大的key
            }

            node.keys[index] = removedNode.keys.pop(); // 替换
            removedNode.children.length--;
          }

          // 依据删除后key的个数是否小于最小值，按需要调整树

          while (removedNode.keys.length < this.minKeyNum) {
            if (removedNode === this.root) {
              /* 如果被删key位于根节点，则根节点最小key个数为1,如果删除后个数为0则表示
               该结点唯一的子树为新的根节点 */
              if (removedNode.keys.length === 0) {
                this.root = removedNode.children[0];
                this.root && (this.root.parent = null);
              }
              break;
            }

            const removeParent = removedNode.parent;
            const parentKeys = removeParent.keys;
            const parentChildren = removeParent.children;
            const removedIndex = parentChildren.indexOf(removedNode);
            const leftSibling = parentChildren[removedIndex - 1];
            const rightSibling = parentChildren[removedIndex + 1];

            /* 左兄弟结点的key个数未达到最小值，从左兄弟结点中借取一个元素 */
            if (leftSibling && leftSibling.keys.length > this.minKeyNum) {
              // 从左兄弟结点中选取最大的关键字移动至父结点，父结点的邻近关键字移动至removedNode中

              removedNode.keys.unshift(parentKeys[removedIndex - 1]); // 父结点中的key插在removedNode第一个位置
              parentKeys[removedIndex - 1] = leftSibling.keys.pop();

              const leftLast = leftSibling.children.pop();
              leftLast && (leftLast.parent = removedNode); // 更新被移动的子树的父结点
              removedNode.children.unshift(leftLast);

              return;
            }

            /* 右兄弟结点的key个数未达到最小值，从右兄弟结点中借取一个元素 */
            if (rightSibling && rightSibling.keys.length > this.minKeyNum) {
              // 从右兄弟结点中选取最小的关键字移动至父结点，父结点的邻近关键字移动至removedNode中

              removedNode.keys.push(parentKeys[removedIndex]);
              parentKeys[removedIndex] = rightSibling.keys.shift();

              const rightFirst = rightSibling.children.shift();
              rightFirst && (rightFirst.parent = removedNode); // 同上
              removedNode.children.push(rightFirst);

              return;
            }

            // 左右兄弟结点均仅剩最少个数的key，需要合并结点

            if (leftSibling) {
              // removedNode与左兄弟结点合并，将左兄弟合并至removedNode中
              /* 合并时，将左兄弟结点的key、父结点中大于左兄弟结点且右侧相邻的key顺次插入removedNode中的前面 */

              removedNode.keys.unshift(...leftSibling.keys, parentKeys[removedIndex - 1]);

              leftSibling.children.forEach(n => n && (n.parent = removedNode)); // 更新左兄弟结点中的子树的parent指针
              removedNode.children.unshift(...leftSibling.children);

              parentChildren.splice(removedIndex - 1, 1);
              parentKeys.splice(removedIndex - 1, 1);

              /* 合并时，父结点失去了一个key，因此需要继续判断父结点key个数是否已小于最小值 */
              removedNode = removeParent;
              continue;
            }

            if (rightSibling) {
              // removedNode与右兄弟结点合并，将右兄弟合并至removedNode中
              /* 合并时，将父结点中小于右兄弟结点且左侧相邻的key、右兄弟结点的key顺次插入removedNode的后面 */

              removedNode.keys.push(parentKeys[removedIndex], ...rightSibling.keys);

              rightSibling.children.forEach(n => n && (n.parent = removedNode));
              removedNode.children.push(...rightSibling.children);

              parentChildren.splice(removedIndex + 1, 1);
              parentKeys.splice(removedIndex, 1);

              removedNode = removeParent;
              continue;
            }
          } // while ()
        } // function removeKey
      };

      const bt = new BTree(4);
      bt.search(35, 30, 25, 20, 15, 10, 5);
      console.log('bt search: \n%s', bt.export());

      bt.remove(5, 10, 15, 20, 25, 30, 35);
      console.log('bt remove: \n%s', bt.export());

      bt.search(5, 10, 15, 20, 25, 30, 35);
      console.log('bt 2 search: \n%s', bt.export());
    </script>

    <script>
      /* B+Tree */

      /* B+Tree非叶子结点 */
      function BPNode(parent) {
        this.keys = []; // 所有的关键字为该结点每个子树根结点中最大的关键字
        this.children = []; // 非叶子结点的关键字个数与子树个数相同。这里'children[i] <= key[i]'
        this.parent = parent;
      }

      /* B+Tree叶子结点 */
      function BPLeaf(parent, next, prev) {
        BPNode.call(this, parent);
        this.next = next; // 下一个叶子结点，用于从头开始序列化访问
        this.prev = prev;
      }
      BPLeaf.prototype = Object.create(BPNode.prototype);

      function BPTree(order) {
        this.root = null;
        this.seqHead = null; // 第一个叶子结点，即最左侧的叶子结点。用于序列化访问
        this.seqTail = null; // 最后一个叶子结点，即最右侧的叶子结点。用于序列化访问
        this.order = order;
      }

      Object.defineProperties(BPTree.prototype, {
        /* 结点最少的关键字个数 */
        minKeyNum: {
          get() {
            return Math.ceil(this.order / 2);
          },
        },
        /* 结点最多的关键字个数 */
        maxKeyNum: {
          get() {
            return this.order;
          },
        },
        /* 全部的关键字，以序列化访问方式返回全部的关键字 */
        allKeys: {
          get() {
            if (!this.seqHead) return [];

            const keys = [];
            let p = this.seqHead;
            while (p) {
              keys.push(...p.keys);
              p = p.next;
            }

            return keys;
          },
        },
        allKeysReversed: {
          get() {
            if (!this.seqTail) return [];

            const reversed = [];
            let p = this.seqTail;
            while (p) {
              reversed.push(...p.keys.toReversed());
              p = p.prev;
            }

            return reversed;
          },
        },
      });

      BPTree.prototype.export = BTree.prototype.export;
      BPTree.prototype.bSearch = BTree.prototype.bSearch;

      /* 在树中查找key值，若不存在则插入 */
      BPTree.prototype.search = function (...keys) {
        let foundKeys = [];
        for (const key of keys) {
          if (this.root == null) {
            const root = new BPLeaf();
            root.keys.push(key);
            root.children.length++;
            this.root = root;
            this.seqHead = root;
            this.seqTail = root;
            continue;
          }

          // 从根结点开始查找
          let node = this.root;
          let found, i;
          /* 在插入新key时，第一个需要更新最大key的非叶子结点。并且后续查找路径中所有的非叶子结点都需要更新最大的key */
          let updateRoot;
          while (node) {
            ({ found, i } = this.bSearch(node.keys, key));

            /* 无论是否找到key,都需要查找到叶子结点为止
            B+Tree中，叶子结点中的查找结果为最终的结果 */
            if (node instanceof BPLeaf) break;

            if (found) {
              node = node.children[i];
              continue;
            }

            // 当前非叶子结点node中没找到key

            if (i === node.keys.length - 1) {
              /* key比所有的关键字大。
              node所有子树或者小于node.keys的最大关键字,或者等于最大关键字。子树中不可能再找到等于key的关键字。
              此时仍然需要在最大的子树中继续查找，找到将保存该key的叶子结点，然后添加到叶子结点中。
              注意，这时候需要更新一些父结点的最大关键字 */

              if (!updateRoot) {
                updateRoot = node;
              }
              node = node.children.at(-1);
              continue;
            }

            // i === -1(key小于所有的关键字) 或者key在当前结点关键字的范围之中
            node = node.children[i + 1];
          }

          // 已查找至叶子结点

          if (found) {
            foundKeys.push(key);
            continue;
          }

          /* 叶子结点中没找到key, 插入这个key */
          node.keys.splice(i + 1, 0, key);
          node.children.length++;

          /* 更新查找路径上非叶子结点的最大key */
          if (updateRoot) {
            let p = node.parent;
            while (p && p !== updateRoot.parent) {
              p.keys[p.keys.length - 1] = key;
              p = p.parent;
            }
          }

          // 结点插入新key之后的分裂以及更新操作

          while (true) {
            if (node.keys.length <= this.maxKeyNum) break;

            // 关键字插入结点之后，叶子结点的关键字个数超出最大值

            let newNode;
            if (node instanceof BPLeaf) {
              newNode = new BPLeaf(node.parent);
              /* 维护序列化访问的链表指针
              分裂叶子结点时，新结点始终作为被分裂结点的右侧结点，因此即使分裂的是"seqHead"结点，也无需
              更新"seqHead"指针 */
              newNode.next = node.next;
              newNode.prev = node;

              if (node.next == null) {
                // 如果当前结点是序列化访问的最后一个结点，需要更新seqTail指针

                this.seqTail = newNode;
              } else {
                node.next.prev = newNode;
              }
              node.next = newNode;
            } else {
              newNode = new BPNode(node.parent);
            }

            // 当前结点保留最少个数的key,剩余的key全部移动至新结点中
            const deletedKeys = node.keys.splice(this.minKeyNum);
            newNode.keys.push(...deletedKeys);
            const deletedChildren = node.children.splice(this.minKeyNum);
            newNode.children.push(...deletedChildren);
            deletedChildren.forEach(c => (c.parent = newNode)); // 更新原来子树的父结点为新的结点

            // 在父结点中更新并插入key

            if (node.parent == null) {
              // 当前结点是跟结点，需要新建跟结点并更新'this.root'指针
              const newRoot = new BPNode();
              node.parent = newNode.parent = newRoot;
              newRoot.children.push(node);
              this.root = newRoot;
            }
            const parent = node.parent;
            const nodeIndex = parent.children.indexOf(node);
            /* 在父结点中更新和插入原结点分裂后新的最大值与新结点的最大值 */
            parent.keys.splice(nodeIndex, 1, node.keys.at(-1), newNode.keys.at(-1));
            parent.children.splice(nodeIndex + 1, 0, newNode);

            node = parent; // 继续判断父结点的关键字是否超出最大值
          }
        }

        if (foundKeys.length !== 0) {
          console.log('keys found! %s', foundKeys.join(', '));
        }
      };

      /* 删除树中某一个关键字 */
      BPTree.prototype.remove = function (...keys) {
        for (const key of keys) {
          if (this.root == null) {
            return;
          }

          let node = this.root;
          let found, i;
          while (node) {
            ({ found, i } = this.bSearch(node.keys, key));

            if (node instanceof BPLeaf) break;

            if (found) {
              /* 在非叶子结点中找到key，继续向下查找直到叶子结点 */
              node = node.children[i];
              continue;
            }

            /* 若key大于当前结点所有的关键字,由于非叶子结点的关键字为各子树关键字的最大值，所以
            key不会存在于子树中，结束当前查找，继续查找下一个key */
            if (i === node.keys.length - 1) break;

            node = node.children[i + 1];
          }

          /* 叶子结点中不存在key,或者key大于某一非叶子结点的所有关键字，那么B+Tree中没有该key,继续查找下一个key */
          if (!found) continue;

          // 在叶子结点中找到key

          node.keys.splice(i, 1);
          node.children.length--;

          if (node.parent == null) {
            if (node.keys.length === 0) {
              this.root = this.seqHead = this.seqTail = null;
            }
            continue;
          }

          let currentLeaf = true; // 当前是否位于叶子结点层次
          while (true) {
            if (node.keys.length >= this.minKeyNum) break;

            // 叶子结点的关键字个数少于最小值，需要从左右兄弟借一个关键字或者合并关键字

            const parent = node.parent;
            const nodeIndex = parent.children.indexOf(node);

            const leftSib = parent.children[nodeIndex - 1];
            const rightSib = parent.children[nodeIndex + 1];

            if (leftSib && leftSib.keys.length > this.minKeyNum) {
              /* 将左兄弟结点最大key与子树插入当前结点的第一个元素之前 */
              node.keys.unshift(leftSib.keys.pop());
              node.children.unshift(leftSib.children.pop());

              // 由于左兄弟结点失去了最大key,因此需要更新父结点中左兄弟的索引
              parent.keys[nodeIndex - 1] = leftSib.keys.at(-1);
              break;
            }

            if (rightSib && rightSib.keys.length > this.minKeyNum) {
              node.keys.push(rightSib.keys.shift());
              node.children.push(rightSib.children.shift());

              // 由于当前结点新增了最大的key,因此需要更新父结点中当前结点的索引
              parent.keys[nodeIndex] = node.keys.at(-1);
              break;
            }

            /* 左右兄弟的key个数均已达到最小值，此时应与其中之一合并 */

            /* 注意，合并时与B-Tree不同，不需要将父结点中的、两个子结点间的key移动至合并后的子结点中。
            因为两个待合并的子结点包含所有的key */

            /* 合并时，将较小的结点合并至较大的结点中，这样无需修改父结点中的索引 */

            let merged;
            if (leftSib) {
              // 将左兄弟结点合并至当前结点

              node.keys.unshift(...leftSib.keys);
              node.children.unshift(...leftSib.children);
              leftSib.children.forEach(c => c && (c.parent = node)); // 更新父结点指针
              parent.keys.splice(nodeIndex - 1, 1);
              parent.children.splice(nodeIndex - 1, 1);

              merged = node;

              if (currentLeaf) {
                // 当前结点是叶子结点，需要更新序列化遍历的指针

                if (leftSib.prev == null) {
                  // 左兄弟结点是序列化遍历的头结点

                  this.seqHead = node;
                } else {
                  leftSib.prev.next = node;
                }

                node.prev = leftSib.prev;
              }
            } else if (rightSib) {
              // 将当前结点合并至右兄弟结点

              rightSib.keys.unshift(...node.keys);
              rightSib.children.unshift(...node.children);
              node.children.forEach(c => c && (c.parent = rightSib));
              parent.keys.splice(nodeIndex, 1);
              parent.children.splice(nodeIndex, 1);

              merged = rightSib;

              if (currentLeaf) {
                if (node.prev == null) {
                  this.seqHead = rightSib;
                } else {
                  node.prev.next = rightSib;
                }
                rightSib.prev = node.prev;
              }
            }

            if (parent.parent == null) {
              // 已合并的两个结点为根结点的直接子结点，无需继续判断key的个数

              if (parent.keys.length < 2) {
                this.root = merged;
                merged.parent = null;
              }
              break;
            }

            // 由于父结点中失去了一个key,所以继续判断父结点key个数是否达到最小值
            node = parent;
            currentLeaf = false;
          } // while
        }
      };

      console.log('b+ tree');

      const bpt0 = new BPTree(3);
      bpt0.search(5, 6, 7, 8, 1, 2, 3, 4, 9);
      console.log(bpt0, bpt0.allKeys, bpt0.allKeysReversed);

      bpt0.remove(1, 2, 3, 4, 5, 6);
      console.log(bpt0, bpt0.allKeys, bpt0.allKeysReversed);

      bpt0.search(10, 15, 20, 5, 6, 7, 25);
      console.log(bpt0, bpt0.allKeys, bpt0.allKeysReversed);
    </script>
