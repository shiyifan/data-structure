<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doc</title>
  </head>
  <body>
    <h1>For Data Structure</h1>

    <ul>
      <li>二叉排序树</li>
    </ul>

    <script>
      /* 二叉排序树结点 */
      function STNode(data, left, right) {
        this.data = data;
        this.left = left;
        this.right = right;
      }
      /* 二叉排序树 */
      function STree(root) {
        this.root = root;
      }

      /* 查找多个元素，如果查找失败则新增结点 */
      STree.prototype.search = function (...input) {
        for (const i of input) {
          /* 当树根为空时，先实例化树根 */
          if (this.root == null) {
            this.root = new STNode(i);
            continue;
          }

          let cur = this.root;
          while (true) {
            if (cur.data === i) break; // 找到该元素

            if (cur.data > i) {
              if (!cur.left) {
                /* 树中不存在该元素，且比当前结点小，插入新结点作为左子树 */
                cur.left = new STNode(i);
                break;
              }
              /* 在左子树中继续向下查找 */
              cur = cur.left;
              continue;
            }

            // cur.data < i
            if (!cur.right) {
              /* 树中不存在该元素，且比当前结点大，插入新结点作为右子树 */
              cur.right = new STNode(i);
              break;
            }
            /* 在右子树中继续向下查找 */
            cur = cur.right;
          }
        }
      };

      /* 删除二叉排序树中一个结点，删除后仍具有二叉排序树的特性，保证中序遍历的结果为一有序序列 */
      STree.prototype.remove = function (deleted) {
        let p = this.root;
        let pp; // p的父结点

        while (p) {
          if (p.data === deleted) break;

          pp = p;
          p.data > deleted ? (p = p.left) : (p = p.right);
        }
        if (!p) return; // 树中不存在待删结点

        // p != null, p指向待删结点

        if (!p.left || !p.right) {
          /* p的左子树或者右子树为空，或者两者均为空 */
          if (!pp) {
            /* p是根节点 */
            this.root = !p.left ? p.right : p.left; // 直接更新根节点
            return;
          }

          if (p === pp.left) {
            pp.left = !p.left ? p.right : p.left;
          } else {
            pp.right = !p.left ? p.right : p.left;
          }
          return;
        }

        /* p的左子树与右子树均不为空，此时可将p的左子树上移，并将p的右子树移动至p左子树最右侧结点的右子树 */
        let pRight = p.left;
        // 寻找p左子树最右侧的结点
        while (pRight.right) {
          pRight = pRight.right;
        }
        p === pp.left ? (pp.left = p.left) : (pp.right = p.left);
        pRight.right = p.right;
      };

      /* 返回二叉排序按层遍历的序列，该序列不是标准的按层遍历的结果。不过
      可作为参数输入到'https://tree-graph-algorithm-visualizer.vercel.app/binarytree'中，显示该树的可视化图像 */
      STree.prototype.levelOrder = function () {
        const queue = [this.root];

        let sequence = [];
        while (queue.length !== 0) {
          const node = queue.shift();

          if (node) {
            sequence.push(node.data);
            queue.push(node.left, node.right);
          } else {
            sequence.push('null');
          }
        }

        for (; sequence.at(-1) === 'null'; sequence.pop()); // 删除末尾的'null'直至第一个非'null'

        return sequence.join(',');
      };

      /* 中序遍历 */
      STree.prototype.inOrder = function () {
        let seq = [];

        /* 递归的中序遍历 */
        (function _f(root, seq) {
          if (!root) return;

          _f(root.left, seq);
          seq.push(root.data);
          _f(root.right, seq);
        })(this.root, seq);

        return seq.join(',');
      };

      const t0 = new STree();
      t0.search(8, 4, 10, 1, 3, 9, 7, 6);
      console.log('seq: %s inOrder: %s', t0.levelOrder(), t0.inOrder());

      const deleted = 4;
      t0.remove(deleted);
      console.log('deleted: %i, seq: %s inOrder: %s', deleted, t0.levelOrder(), t0.inOrder());
    </script>
  </body>
</html>
