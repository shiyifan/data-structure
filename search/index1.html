<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>For Data Structure</h1>

    <ul>
      <li>折半查找(Binary Search)</li>
      <li>Fibonacci查找</li>
    </ul>

    <script>
      /* 折半查找 */

      const list = [1, 2, 14, 21, 22, 43];

      console.log('binary search: ', binarySearch(list, 21));

      /* 在list中以折半查找方式查找item，其中list为递增排列的数组 */
      function binarySearch(list, item) {
        let low = 0;
        let high = list.length - 1;

        while (low <= high) {
          const mid = Math.floor((high + low) / 2);

          if (list[mid] === item) {
            return mid;
          }

          if (list[mid] < item) {
            low = mid + 1;
            continue;
          }
          // list[mid] > item
          high = mid - 1;
        }

        return -1;
      }
    </script>

    <script>
      /* Fibonacci查找 */

      const a1 = [14, 17, 23, 27, 29, 34];
      console.log('fib search: ', fibonacciSearch(a1, 17));

      /* 按照Fibonacci数列分割数组查找元素，其中list是递增排列的数组。
      此方法分割数组时仅涉及加减法，在早期计算机上（除法耗时较长）性能会较好，不过在现代计算机上这个性能差异可以忽略不计 */
      function fibonacciSearch(list, item) {
        let fibIndex = fibGreaterThan(list.length);

        // 分割数组后，可能不会在数组0索引开始查找，而从分割点 + fib数开始。该变量用于保存上一个分割点的位置
        let offset = -1;

        while (fibIndex !== 0) {
          // fibIndex前一个fib数，根据这个数分割list，分割后两段数组分别长fibonacci(fibIndex - 1), fibonacci(fibIndex - 2)
          const lastFib = fibonacci(fibIndex - 1);

          const k = Math.min(lastFib + offset, list.length - 1); // 避免数组越界，计算合适的分割点位置

          if (list[k] === item) return k;

          /* item与分割点不相等，那么item应位于两段数组中，对两段数组再次按fibonacci数列分割查找 */

          if (list[k] < item) {
            /* 此时item应位于"fibIndex - 2"那段数组中 */
            offset = k;
            fibIndex = fibIndex - 2;
            continue;
          }

          /* 此时item应位于"fibIndex - 1"的那段数组中 */
          // list[k] > item
          fibIndex = fibIndex - 1;
        }

        /* 分割后，item所在的数组长度为fibonacci(0)，表示未找到item */
        return -1;

        /* 计算大于或等于n的最小Fibnacci数在数列中的索引 */
        function fibGreaterThan(n) {
          let i = 0; // fibonacci数的索引
          let f; // fibonacci数

          // 从索引0开始计算后续的fib数，找到第一个比n大的fib数
          while ((f = fibonacci(i++)) < n);

          return i - 1;
        }

        /* 计算索引为n的fibonacci数，非递归 */
        function fibonacci(n) {
          if (n === 0) return 0;
          if (n === 1) return 1;

          let a = 0;
          let b = 1;
          let c;
          for (let i = 2; i <= n; i++) {
            i % 2 === 0 ? (c = a = a + b) : (c = b = a + b);
          }

          return c;
        }
      }
    </script>
  </body>
