      <li>有向无环图的拓扑排序</li>
    </ul>

    <script>
      /* 有向无环图(AOV, Activities On Vertext)的拓扑排序 */
      /* 顶点表示活动，边表示活动间的优先关系 */

      /* 以邻接表表示有向图 */
      function ALGraph(vertices) {
        this.vertices = vertices; // 一维数组保存所有的顶点
      }
      /* 根据弧尾（from）弧头（to）添加一条边 */
      ALGraph.prototype.addEdge = function (from, to) {
        const fromIndex = this.vertices.findIndex(v => v.data === from);
        const toIndex = this.vertices.findIndex(v => v.data === to);

        const al = new ALVertex(toIndex);
        al.next = this.vertices[fromIndex].firstAdj;
        this.vertices[fromIndex].firstAdj = al;

        return this;
      };
      /* 返回拓扑排序序列 */
      ALGraph.prototype.topoSort = function () {
        const inDegree = calcInDegree.call(this);
        const zero = []; // 保存所有0入度的顶点索引
        let topoCount = 0; // 所有已排序的顶点个数

        inDegree.forEach((d, index) => d === 0 && zero.push(index)); // 计算初始入度为0的顶点，从这些顶点开始拓扑排序

        /* 从入度为0的顶点开始拓扑排序 */
        let sequence = '';
        while (zero.length !== 0) {
          const zeroV = this.vertices[zero.shift()];
          sequence += zeroV.data + ' ';

          for (let adj = zeroV.firstAdj; adj; adj = adj.next) {
            // 将所有邻接点的入度-1,并将入度为0的添加至'zero'数组中
            --inDegree[adj.vIndex] === 0 && zero.push(adj.vIndex);
          }

          topoCount++;
        }

        if (topoCount !== this.vertices.length) {
          // 有向图中存在环
          throw new Error('there may be a circle in the graph!');
        }

        return sequence;

        /* 计算所有顶点的入度 */
        function calcInDegree() {
          const degree = new Array(this.vertices.length); // 以索引表示顶点，值表示顶点的入度
          degree.fill(0);

          for (const v of this.vertices) {
            for (let adj = v.firstAdj; adj; adj = adj.next) {
              degree[adj.vIndex]++;
            }
          }

          return degree;
        }
      };
      /* 顶点 */
      function Vertex(data, firstAdj) {
        this.data = data;
        this.firstAdj = firstAdj; // 第一个出度邻接点，相当于头指针
      }
      /* 顶点的出度邻接点，某一顶点的邻接点组成一个链表 */
      function ALVertex(vIndex, next, weight) {
        this.vIndex = vIndex;
        this.weight = weight;
        this.next = next;
      }

      const vert = [new Vertex('A'), new Vertex('B'), new Vertex('C'), new Vertex('D'), new Vertex('E'), new Vertex('F')];
      const g = new ALGraph(vert);
      g.addEdge('A', 'B').addEdge('B', 'D').addEdge('A', 'C').addEdge('C', 'D').addEdge('E', 'C').addEdge('C', 'F').addEdge('C', 'B');

      const topoSort = g.topoSort();
      console.log('topo sort: ', topoSort);
    </script>
