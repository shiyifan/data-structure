      <li>Dijkstra最短路径算法</li>

    <script>
      /* 用邻接矩阵表示有向图，矩阵中的数值表示边的权值 */
      function MatG(vertices) {
        this.vertices = vertices;

        this.edges = new Array(this.vertices.length);
        for (let i = 0; i < this.edges.length; i++) {
          this.edges[i] = new Array(this.vertices.length);
        }
      }
      /* 添加一条边 */
      MatG.prototype.addEdge = function (from, to, weight) {
        const fromIndex = this.vertices.findIndex(v => v.data === from);
        const toIndex = this.vertices.findIndex(v => v.data === to);

        this.edges[fromIndex][toIndex] = weight;
        return this;
      };
    </script>

    <script>
      /* Dijkstra算法 */

      /* 计算从'source'顶点到其余顶点的最短路径 */
      MatG.prototype.dijkstra = function (source) {
        const srcIndex = this.vertices.findIndex(v => v.data === source);

        // 起始点source到各个顶点的最短距离，'undefined'表示source与该顶点不连通.数组索引表示顶点
        const dist = new Array(this.vertices.length);
        dist[srcIndex] = 0; // 起始点到自身的距离设为0

        /* 数组索引表示顶点，值表示source到该顶点的最短路径上，该顶点的前一个顶点（也就是路径上的倒数第二个顶点）。
        由于最短路径上的每一个顶点，都与source构成每一条最短路径，所以在prev中可以依次找到顶点前面的所有顶点，
        例如某一顶点a的最短路径的逆序为: a, prev[a], prev[prev[a]], prev[prev[prev[a]]]... */
        const prev = new Array(this.vertices.length);

        const Q = []; // 所有待计算最短路径的顶点集，值为顶点的索引
        this.vertices.forEach((_, i) => Q.push(i));

        while (Q.length !== 0) {
          /* 计算当前dist中的最短路径，该路径的就是source到dist[shIndex]的最短路径 */
          let shortest /* 最短路径长度 */, shIndex /* 最短路径的顶点在dist中的索引 */;
          for (let i = 0; i < Q.length; i++) {
            if (dist[Q[i]] == null) continue; // 忽略不连通的顶点

            if (shortest == null || shortest > dist[Q[i]]) {
              shortest = dist[Q[i]];
              shIndex = Q[i];
            }
          }

          if (shIndex == null) {
            /* 没有最短路径表示source与Q中剩余顶点不连通，则依次删除这些顶点 */
            Q.splice(0, 1);
            continue;
          }

          // 已找到当前最短路径，在Q中删除该顶点
          Q.splice(
            Q.findIndex(i => i === shIndex),
            1
          );

          /* 根据已找到最短路径的顶点，计算该顶点与其他邻接点的权值，再加上shortest，能得出source与这些邻接点的路径长度,
          然后更新dist中邻接点的路径长度 */
          for (let i = 0; i < Q.length; i++) {
            const a = shortest + this.edges[shIndex][Q[i]]; // a为source到邻接点的路径长度

            if (isNaN(a)) continue;

            /* 选择与之前相比更短的路径长度。这样，外层'while'循环结束后，dist中就是最短的路径长度，prev则是最短路径 */
            if (dist[Q[i]] == null || a < dist[Q[i]]) {
              dist[Q[i]] = a;
              prev[Q[i]] = shIndex; // 同时更新在最短路径中，该邻接点的上一个点
            }
          }
        }

        /* 根据prev得到source与每个顶点之间的最短路径 */
        const paths = {};
        for (let i = 0; i < prev.length; i++) {
          const iVex = this.vertices[i];

          if (i === srcIndex) continue;

          if (prev[i] == null) {
            paths[iVex.data] = '(no path)';
            continue;
          }

          const path = [i];
          let p = i;
          while ((p = prev[p]) !== srcIndex) {
            path.unshift(p);
          }
          path.unshift(srcIndex);

          const pathStr = path.map(p => this.vertices[p].data).join(',');
          paths[iVex.data] = `(${dist[i]}) ${pathStr}`;
        }

        return paths;
      };
      /* 顶点 */
      function V(data) {
        this.data = data;
      }

      const vertices = [new V('V0'), new V('V1'), new V('V2'), new V('V3'), new V('V4'), new V('V5')];
      const g0 = new MatG(vertices);
      g0.addEdge('V0', 'V4', 30);
      g0.addEdge('V0', 'V2', 10);
      g0.addEdge('V0', 'V5', 100);
      g0.addEdge('V1', 'V2', 5);
      g0.addEdge('V2', 'V3', 50);
      g0.addEdge('V3', 'V5', 10);
      g0.addEdge('V4', 'V3', 20);
      g0.addEdge('V4', 'V5', 60);

      const paths = g0.dijkstra('V0');
      console.log('shortest paths: ', paths);
    </script>

    <script>
      /* Floyd算法 */
      MatG.prototype.floyd = function (from, to) {
        const fromIndex = this.vertices.findIndex(v => v.data === from);
        const toIndex = this.vertices.findIndex(v => v.data === to);

        return f(fromIndex, toIndex, this.edges, this.vertices.length - 1);

        function f(from, to, edges, k) {
          if (k === 0) return edges[from][to];

          const lastK = f(from, to, edges, k - 1);
          const from_k = f(from, k, edges, k - 1);
          const k_to = f(k, to, edges, k - 1);
          const from_to = from_k + k_to;

          if (isNaN(lastK) && isNaN(from_to)) return NaN;

          if (isNaN(lastK)) return from_to;

          if (isNaN(from_to)) return lastK;

          return from_to < lastK ? from_to : lastK;
        }
      };

      const vertices2 = [new V('A'), new V('B'), new V('C')];
      const g1 = new MatG(vertices2);
      g1.addEdge('A', 'B', 5).addEdge('A', 'C', 1).addEdge('C', 'B', 1);

      const pathLength = g0.floyd('V0', 'V5');
      console.log('floyd: ', pathLength);
    </script>
