  <body>
    <h2>For Data Structure</h2>

    <ul>
      <li>回溯法与树的遍历</li>
      <li>N皇后的问题</li>
    </ul>

    <script>
      const listA = [1, 2, 3];

      const powerList = [];
      powerSet(0, listA, [], powerList);
      console.log('powerlist: ', powerList);
      console.log('powerList(no recursive, Stack): ', powerSet_noRec_S(listA));
      console.log('powerList(no rec, Q): ', powerSet_noRec_Q(listA));

      // 求解一个集合的幂集，即该集合所有子集构成的集合
      /* i: 当前取舍的元素索引, list: 集合, temp: 临时变量，powerResult: 最终所有子集构成的集合 */
      function powerSet(i, list, temp, powerResult) {
        if (i >= list.length) {
          powerResult.push(temp);
          return;
        }

        powerSet(i + 1, list, [list[i], ...temp], powerResult); // 取当前元素加入集合中
        powerSet(i + 1, list, [...temp], powerResult); // 舍弃当前元素
      }

      /* 求解一个集合的幂集，参照上面递归函数'powerSet'编写的非递归函数，利用栈实现 */
      function powerSet_noRec_S(list) {
        /* 递归函数中，函数的末尾有两个连续的递归调用：'取'函数调用和'舍'函数调用。
        由于先递归调用取函数，再调用舍函数，因此一定是先重复地调用取函数，然后取函数返回，再调用依次舍函数，然后再重复地调用取函数，
        然后取函数返回....重复上述过程。
        因此调用栈中先重复地压栈取函数参数，然后弹栈。然后再压栈舍函数参数，然再次重复地压栈取函数参数、弹栈...按此顺序重复下去 */

        const stack = []; // 调用栈
        const powerSet = []; // 幂集，元素为所有的子集

        /* 模拟'powerSet'的首次调用 */
        stack.push({
          current: 0 /* 需要决定是否取舍的元素的索引 */,
          temp: [] /* 保存每次取舍的结果 */,
        });

        while (stack.length !== 0) {
          const { current, temp } = stack.at(-1);

          if (current >= list.length) {
            /* 全部元素均已完成取舍，保存结果 */
            powerSet.push(temp);
            stack.pop(); // 弹栈，相当于powerSet递归调用结束

            if (stack.length === 0) {
              break;
            }

            /* 由于在连续两个取函数与舍函数调用之后没有任何其他操作并且当前函数直接返回，所以此处直接将
            当前函数栈弹出，并压入当前函数的舍函数，这样，当舍函数被弹出后，栈顶即是当前函数的上一层调用 */
            const { current: lastCurrent, temp: lastTemp } = stack.pop();
            stack.push({ current: lastCurrent + 1, temp: [...lastTemp] });
            continue;
          }

          stack.push({ current: current + 1, temp: [list[current], ...temp] });
        }

        return powerSet;
      }

      /* 求解一个集合的幂集，参照上面递归函数'powerSet'编写的非递归函数，利用队列实现 */
      function powerSet_noRec_Q(list) {
        const Q = [];
        const powerSet = [];

        Q.push({ temp: [], i: 0 });
        while (Q.length !== 0) {
          const { temp, i } = Q.shift();

          if (i >= list.length) {
            powerSet.push(temp);
            continue;
          }

          Q.push({ temp: [...temp, list[i]], i: i + 1 });
          Q.push({ temp: [...temp], i: i + 1 });
        }

        return powerSet;
      }

      console.log('fact: ', fact(10));

      function fact(n) {
        if (n === 0) return 1;
        return n * fact(n - 1);
      }
    </script>

    <script>
      /* n皇后问题 */

      /* 由于n个皇后不能相互攻击（不可同行同列同对角线），所以在"n x n"的棋盘中，每行一定仅有一个皇后.
  所以n个皇后的棋盘保存在长度为n的线性表中，索引表示皇后所在行，数组元素表示皇后所在列 */

      const notAttacks = []; // 不会互相攻击的棋盘
      drop([], 0, 4, notAttacks); //4皇后问题，在第一行开始试探性放置棋子

      console.log('queens: ', notAttacks.length);
      console.log(notAttacks.join('; '));

      const notAttack2 = drop_noRec_Q(4); // 4皇后问题
      console.log('queens norec(Q): ', notAttack2.length);
      console.log(notAttack2.join('; '));

      const notAttack3 = drop_noRec_S(4);
      console.log('queens norec(S): ', notAttack3.length);
      console.log(notAttack3.join('; '));

      /* 在当前行放置棋子 */
      /* queens: 当前的棋盘，row：当前行，n：全部皇后个数，notAttacks：不会相互攻击的棋盘 */
      function drop(queens, row, n, notAttacks) {
        if (row >= n) {
          // 已放置全部皇后并不会相互攻击
          notAttacks.push(queens);
          return;
        }

        // 试探性地在下一行的每一列放置棋子并判断是否相互攻击
        for (let i = 0; i < n; i++) {
          const newChess = [...queens, i];

          if (canAttack(newChess)) continue; // 相互攻击的棋盘不再继续试探地放置下一行棋子，而是试探当前行的下一个位置

          // 如果当前行当前列不会相互攻击，那么直接试探下一行的棋子位置
          drop(newChess, row + 1, n, notAttacks);
        }
      }

      /* N皇后问题的非递归函数，利用栈实现 */
      function drop_noRec_S(n /* 皇后个数 */) {
        const notAttacks = [];
        const stack = [];

        stack.push({ queens: [], row: 0 /* 当前要放置皇后的行 */, col: 0 /* 当前行要试探的列 */ });

        while (stack.length !== 0) {
          const top = stack.at(-1);
          const { queens, row } = top;

          if (row >= n) {
            /* 如果当前行超出棋盘，则表示所有的棋子均已放置，当前的棋盘是一个结果 */
            notAttacks.push(queens);
            stack.pop();
            continue;
          }

          if (top.col >= n) {
            /* 如果当前行已在所有的列上试探了皇后的位置，那么退回至上一行 */
            stack.pop();
            continue;
          }

          /* 在当前列以及后面的列，为当前行寻找一个合适的位置 */
          let newChess;
          while (top.col < n) {
            newChess = [...queens, top.col++];

            if (!canAttack(newChess)) break;

            newChess = null;
          }
          if (!newChess) {
            /* 未能找到合适的放置位置 */
            stack.pop();
            continue;
          }

          /* 当前行的位置已找到则直接探索下一行的位置 */
          stack.push({ queens: newChess, row: row + 1, col: 0 });
        }

        return notAttacks;
      }

      /* N皇后问题的非递归函数，利用队列实现 */
      function drop_noRec_Q(n /* 皇后个数 */) {
        const notAttacks = []; // 保存所有互不攻击的棋盘
        const Q = []; // 队列，保存所有可能的棋盘

        Q.push({ queens: [], row: 0 /* 当前放置皇后的所在行 */ });

        while (Q.length !== 0) {
          const { queens, row } = Q.shift();

          if (row >= n) {
            notAttacks.push(queens);
            continue;
          }

          /* 将当前行棋子的所有可能放置的位置添加至队尾 */
          for (let i = 0; i < n; i++) {
            const newChess = [...queens, i];

            if (canAttack(newChess)) continue;

            Q.push({ queens: newChess, row: row + 1 });
          }
        }

        return notAttacks;
      }

      function canAttack(chessmans) {
        if (chessmans.length === 0 || chessmans.length === 1) return false;

        /* 每次用最后一个棋子与其他棋子比较。由于chessman的数组长度随着递归的深层调用而增长，
  每次用最后一个棋子比较，累次比较之后可以保证chessman中所有棋子都不可相互攻击 */
        const lastManRow = chessmans.length - 1;
        const lastManCol = chessmans[lastManRow];

        for (let i = 0; i < lastManRow; i++) {
          // 判断是否在同一列
          if (chessmans[i] === lastManCol) return true;

          // 判断是否在同一对角线，即判断行索引之差与列索引之差是否相等
          const x = Math.abs(lastManRow - i);
          const y = Math.abs(lastManCol - chessmans[i]);
          if (x === y) return true;
        }

        return false;
      }
    </script>
